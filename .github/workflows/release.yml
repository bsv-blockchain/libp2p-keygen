name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          # macOS (Intel)
          GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" -o libp2p-keygen-darwin-amd64 .

          # macOS (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" -o libp2p-keygen-darwin-arm64 .

          # Linux (amd64)
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" -o libp2p-keygen-linux-amd64 .

          # Linux (arm64)
          GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" -o libp2p-keygen-linux-arm64 .

          # Windows (amd64)
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" -o libp2p-keygen-windows-amd64.exe .

      - name: Create checksums
        run: |
          sha256sum libp2p-keygen-* > checksums.txt
          cat checksums.txt

      - name: Create Release and Upload Binaries
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            libp2p-keygen-darwin-amd64
            libp2p-keygen-darwin-arm64
            libp2p-keygen-linux-amd64
            libp2p-keygen-linux-arm64
            libp2p-keygen-windows-amd64.exe
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
